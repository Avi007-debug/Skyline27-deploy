services:
  - type: web
    name: spotlight-backend
    env: node
    region: singapore
    buildCommand: npm install && npm run build && npx prisma migrate deploy
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: CAMPUS_UTC_OFFSET_MINUTES
        value: "330"
      - key: SITE_URL
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GODADDY_UPLOAD_URL
        sync: false
      - key: UPLOAD_SECRET
        sync: false
