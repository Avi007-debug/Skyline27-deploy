<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        var noop = function() {};
        window.console.warn = noop;
        window.console.log = noop;
        window.console.info = noop;
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SkylineOS — The unified platform for campus clubs, events, memberships and merchandise." />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="shortcut icon" type="image/png" href="/favicon.png" />
    <title>SkylineOS — Campus Event Operating System</title>

    <!-- Preconnect to font origins for faster loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Google Sans (Product Sans feel) + Inter + display fonts -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800;1,14..32,400&family=JetBrains+Mono:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" />

    <script>
      (function() {
        try {
          var saved = localStorage.getItem('spotlight_theme');
          var theme = saved || 'dark';
          document.documentElement.classList.remove('dark', 'light');
          document.documentElement.classList.add(theme);
        } catch (e) {}
      })();
    </script>

    <style>
      html, body { margin: 0; padding: 0; }
      #root { min-height: 100%; }

      /* ── Unified Club Platform Splash Screen ──────────────────────────── */
      #skyline-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0b0b0d;
        color: #fafafa;
        overflow: hidden;
        user-select: none;
        cursor: default;
        transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1),
                    transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        will-change: opacity, transform;
      }

      /* Light Theme (GDG Clean Professional) */
      html.light #skyline-splash {
        background: #ffffff;
        color: #111827;
      }

      /* Ambient background glow & patterns */
      .splash-ambient-bg {
        position: absolute;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
      }
      .dark .splash-ambient-bg {
        background:
          radial-gradient(ellipse 70% 50% at 50% 25%, rgba(74, 143, 245, 0.18) 0%, transparent 60%),
          radial-gradient(ellipse 60% 40% at 75% 75%, rgba(139, 92, 246, 0.14) 0%, transparent 60%),
          radial-gradient(ellipse 50% 30% at 25% 70%, rgba(20, 184, 166, 0.10) 0%, transparent 60%);
      }
      html.light .splash-ambient-bg {
        background-color: #ffffff;
        background-image:
          radial-gradient(circle at 50% 30%, rgba(26, 115, 232, 0.07) 0%, transparent 65%),
          radial-gradient(circle, #e5e7eb 1px, transparent 1px);
        background-size: 100% 100%, 28px 28px;
        opacity: 0.85;
      }

      /* Dismissed state */
      #skyline-splash.splash-out {
        opacity: 0 !important;
        transform: scale(0.97) !important;
        pointer-events: none !important;
      }

      .splash-card {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        max-width: 360px;
        padding: 24px;
        text-align: center;
        animation: splashCardIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      @keyframes splashCardIn {
        from { opacity: 0; transform: translateY(14px) scale(0.96); }
        to   { opacity: 1; transform: translateY(0) scale(1); }
      }

      /* Orbit constellation for the 3 pillars (Events, Members, Money) */
      .splash-orbit-wrap {
        position: relative;
        width: 110px;
        height: 110px;
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .splash-orbit-ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 1.5px dashed rgba(255, 255, 255, 0.15);
        animation: splashOrbitSpin 14s linear infinite;
      }
      html.light .splash-orbit-ring {
        border-color: rgba(26, 115, 232, 0.22);
      }

      @keyframes splashOrbitSpin {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
      }

      /* 3 Orbit satellites: Events (Blue), Members (Green), Ledger (Amber) */
      .orbit-node {
        position: absolute;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        box-shadow: 0 0 10px currentColor;
      }
      .orbit-node-events {
        top: -5px;
        left: calc(50% - 5px);
        background: #1a73e8;
        color: #1a73e8;
      }
      .orbit-node-members {
        bottom: 8px;
        right: 0px;
        background: #188038;
        color: #188038;
      }
      .orbit-node-ledger {
        bottom: 8px;
        left: 0px;
        background: #fbbc04;
        color: #fbbc04;
      }

      /* Logo center badge */
      .splash-logo-box {
        position: relative;
        z-index: 1;
        width: 68px;
        height: 68px;
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.14);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5),
                    0 0 20px rgba(74, 143, 245, 0.2);
        backdrop-filter: blur(8px);
      }
      html.light .splash-logo-box {
        background: #ffffff;
        border-color: rgba(0, 0, 0, 0.08);
        box-shadow: 0 10px 30px rgba(26, 115, 232, 0.12),
                    0 1px 3px rgba(0, 0, 0, 0.06);
      }
      .splash-logo-box img {
        width: 48px;
        height: 48px;
        object-fit: contain;
        border-radius: 12px;
      }

      /* Wordmark & Brand Title */
      .splash-title-row {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 4px;
      }
      .splash-wordmark {
        font-family: 'Google Sans', 'Inter', system-ui, sans-serif;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: #ffffff;
      }
      html.light .splash-wordmark {
        color: #111827;
      }

      .splash-os-badge {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        padding: 2px 7px;
        border-radius: 6px;
        background: rgba(74, 143, 245, 0.18);
        color: #4a8ff5;
        border: 1px solid rgba(74, 143, 245, 0.3);
      }
      html.light .splash-os-badge {
        background: rgba(26, 115, 232, 0.10);
        color: #1a73e8;
        border-color: rgba(26, 115, 232, 0.22);
      }

      /* GDG 4-color bar in light mode / Aurora glow bar in dark mode */
      .splash-color-stripe {
        display: flex;
        gap: 4px;
        width: 48px;
        height: 3px;
        margin: 6px 0 14px;
        border-radius: 99px;
        overflow: hidden;
      }
      .dark .splash-color-stripe {
        width: 56px;
        background: linear-gradient(90deg, #4a8ff5, #a855f7, #14b8a6);
      }
      html.light .splash-color-stripe span:nth-child(1) { flex: 1; background: #1a73e8; }
      html.light .splash-color-stripe span:nth-child(2) { flex: 1; background: #ea4335; }
      html.light .splash-color-stripe span:nth-child(3) { flex: 1; background: #fbbc04; }
      html.light .splash-color-stripe span:nth-child(4) { flex: 1; background: #34a853; }

      /* Subtitle: One Platform for Events, Members & Money */
      .splash-tagline {
        font-family: 'Inter', system-ui, sans-serif;
        font-size: 13px;
        font-weight: 500;
        color: #a1a1aa;
        margin-bottom: 16px;
        letter-spacing: -0.01em;
      }
      html.light .splash-tagline {
        color: #4b5563;
      }

      /* 3 Unified Pillar Chips from the hackathon prep pack */
      .splash-pillars {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 24px;
      }
      .splash-pillar-chip {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 4px 10px;
        border-radius: 99px;
        font-family: 'Inter', system-ui, sans-serif;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.01em;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.10);
        color: #d4d4d8;
        transition: transform 0.2s ease;
      }
      html.light .splash-pillar-chip {
        background: #f3f4f6;
        border-color: #e5e7eb;
        color: #374151;
      }

      .chip-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
      }
      .chip-events .chip-dot { background: #1a73e8; }
      .chip-members .chip-dot { background: #188038; }
      .chip-ledger .chip-dot { background: #fbbc04; }

      /* Loader Track & Dynamic Status */
      .splash-progress-track {
        width: 180px;
        height: 3px;
        border-radius: 99px;
        background: rgba(255, 255, 255, 0.10);
        overflow: hidden;
        position: relative;
        margin-bottom: 10px;
      }
      html.light .splash-progress-track {
        background: #e5e7eb;
      }

      .splash-progress-bar {
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        width: 0%;
        border-radius: 99px;
        background: linear-gradient(90deg, #4a8ff5, #38bdf8);
        animation: splashProgressFill 1.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      html.light .splash-progress-bar {
        background: #1a73e8;
      }

      @keyframes splashProgressFill {
        0%   { width: 0%; }
        40%  { width: 55%; }
        80%  { width: 88%; }
        100% { width: 100%; }
      }

      /* Micro-status cycler text */
      .splash-status-text {
        font-family: 'Inter', system-ui, sans-serif;
        font-size: 11px;
        font-weight: 500;
        color: #71717a;
        height: 16px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      html.light .splash-status-text {
        color: #6b7280;
      }

      .splash-pulse-dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #4a8ff5;
        animation: splashPulse 1.2s ease-in-out infinite;
      }
      html.light .splash-pulse-dot {
        background: #1a73e8;
      }
      @keyframes splashPulse {
        0%, 100% { opacity: 0.4; transform: scale(0.9); }
        50%      { opacity: 1;   transform: scale(1.2); }
      }

      /* Escape hint */
      .splash-tap-hint {
        position: absolute;
        bottom: 24px;
        font-family: 'Inter', system-ui, sans-serif;
        font-size: 10px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.25);
        pointer-events: none;
      }
      html.light .splash-tap-hint {
        color: rgba(0, 0, 0, 0.25);
      }
    </style>
  </head>
  <body>
    <!-- ── Unified Club Platform Splash Screen (Failsafe & Dual-Theme) ── -->
    <div id="skyline-splash" aria-hidden="true">
      <div class="splash-ambient-bg"></div>

      <div class="splash-card">
        <!-- Rotating constellation of the 3 unified pillars -->
        <div class="splash-orbit-wrap">
          <div class="splash-orbit-ring">
            <span class="orbit-node orbit-node-events" title="Events & Tickets"></span>
            <span class="orbit-node orbit-node-members" title="Member Identity"></span>
            <span class="orbit-node orbit-node-ledger" title="Tamper-evident Ledger"></span>
          </div>
          <div class="splash-logo-box">
            <img src="/logo.png" alt="SkylineOS" />
          </div>
        </div>

        <div class="splash-title-row">
          <span class="splash-wordmark">SkylineOS</span>
          <span class="splash-os-badge">Campus OS</span>
        </div>

        <!-- GDG accent bar for light / Aurora gradient for dark -->
        <div class="splash-color-stripe">
          <span></span><span></span><span></span><span></span>
        </div>

        <div class="splash-tagline">One Platform for Events, Members & Money</div>

        <!-- 3 Pillars from Hackathon Brief -->
        <div class="splash-pillars">
          <span class="splash-pillar-chip chip-events">
            <span class="chip-dot"></span>Events
          </span>
          <span class="splash-pillar-chip chip-members">
            <span class="chip-dot"></span>Members
          </span>
          <span class="splash-pillar-chip chip-ledger">
            <span class="chip-dot"></span>Ledger
          </span>
        </div>

        <!-- Progress bar -->
        <div class="splash-progress-track">
          <div class="splash-progress-bar"></div>
        </div>

        <!-- Dynamic status -->
        <div class="splash-status-text">
          <span class="splash-pulse-dot"></span>
          <span id="splash-status-label">Syncing member identity & ledger…</span>
        </div>
      </div>

      <div class="splash-tap-hint">Tap to enter</div>
    </div>

    <!-- ── Anti-Stuck Guaranteed Dismissal Controller ── -->
    <script>
      (function() {
        var dismissed = false;
        var statusLabel = document.getElementById('splash-status-label');

        // Dynamic status text sequence
        setTimeout(function() {
          if (statusLabel && !dismissed) statusLabel.textContent = 'Verifying cryptographic ledger…';
        }, 600);
        setTimeout(function() {
          if (statusLabel && !dismissed) statusLabel.textContent = 'One platform ready.';
        }, 1200);

        // Core dismissal function (callable by React or timeout)
        window.__dismissSkylineSplash = function() {
          if (dismissed) return;
          dismissed = true;
          if (window.__splashSafetyTimer) clearTimeout(window.__splashSafetyTimer);

          var el = document.getElementById('skyline-splash');
          if (!el) return;

          el.classList.add('splash-out');
          el.style.pointerEvents = 'none';

          // Clean up DOM after CSS fade
          setTimeout(function() {
            try {
              if (el && el.parentNode) el.parentNode.removeChild(el);
            } catch (e) {}
          }, 450);
        };

        // Fail-safe 1: Automatic timeout ensures user NEVER gets stuck (max 2.2s)
        window.__splashSafetyTimer = setTimeout(function() {
          window.__dismissSkylineSplash();
        }, 2200);

        // Fail-safe 2: Tap or click anywhere on splash immediately dismisses it
        var splashEl = document.getElementById('skyline-splash');
        if (splashEl) {
          splashEl.addEventListener('click', function() {
            window.__dismissSkylineSplash();
          });
        }
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
